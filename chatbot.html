<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jouko Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,600;8..144,700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-frame chatbot-frame">
      <header class="topbar chatbot-topbar-wrap">
        <div class="floating-map-bar" aria-label="Jouko app bar">
          <button id="profileButton" class="icon-button icon-on-primary" aria-label="Open menu">
            <span class="material-symbols-rounded">menu</span>
          </button>
          <h1 class="floating-title">Jouko</h1>
          <div class="bar-right-actions">
            <button id="toggleDemoButton" class="icon-button icon-on-primary" aria-label="Hide or show AI demo profile">
              <span class="material-symbols-rounded">tune</span>
            </button>
            <button id="chatbotContrastButton" class="icon-button icon-on-primary" aria-label="Toggle high contrast mode">
              <span class="material-symbols-rounded">contrast</span>
            </button>
          </div>
        </div>
      </header>

      <div id="menuPanel" class="menu-panel menu-panel-chatbot hidden" aria-label="Main menu">
        <a href="./map.html" class="menu-link menu-link-with-icon">
          <span class="material-symbols-rounded menu-link-icon">map</span>
          <span>Bus map</span>
        </a>
      </div>

      <main class="chatbot-layout">
        <section class="chatbot-hero card">
          <div class="jouko-bot-icon" aria-hidden="true">
            <div id="botAvatar" class="bot-avatar" role="button" tabindex="0" aria-label="Tap Jouko bot">
              <div class="bot-halo"></div>
              <div class="bot-head">
                <div class="bot-screen">
                  <span class="bot-eye left"></span>
                  <span class="bot-eye right"></span>
                </div>
              </div>
              <div class="bot-cheek bot-cheek-left"></div>
              <div class="bot-cheek bot-cheek-right"></div>
              <div id="botSparkles" class="bot-sparkles" aria-hidden="true"></div>
              <div class="bot-body"></div>
            </div>
            <div id="botThought" class="bot-thought" aria-live="polite"></div>
          </div>
          <p class="chatbot-subtitle">Ask about routes, delays, tickets, or nearest stops.</p>
        </section>

        <section class="card chatbot-settings" aria-label="Personalization demo controls">
          <div class="chatbot-settings-head">
            <h2>AI demo profile</h2>
            <p>This simulates adaptive UX and accessibility support.</p>
          </div>
          <p class="profile-pill">User profile: wheelchair access required</p>
          <div class="chatbot-toggle-grid">
            <button class="chip toggle-chip" data-toggle="simpleLanguage" aria-pressed="false">Simple language</button>
            <button class="chip toggle-chip" data-toggle="highContrast" aria-pressed="false">High contrast</button>
          </div>
          <div id="adaptiveHints" class="adaptive-hints"></div>
        </section>

        <section id="chatMessages" class="chat-messages card" aria-live="polite">
          <article class="chat-bubble bot">Hi! I am Jouko assistant. Try asking: "When is bus 5 leaving to city centre?"</article>
        </section>

        <p id="speechStatus" class="speech-status">Read aloud is ready.</p>

        <form id="chatForm" class="chat-input-bar" autocomplete="off">
          <input id="chatInput" type="text" placeholder="Ask Jouko chatbot..." />
          <button id="speakButton" type="button" class="ghost-btn">Read Aloud</button>
          <button type="submit" class="primary-btn">Send</button>
        </form>
      </main>
    </div>

    <script type="module" src="./dist/chatbot.js"></script>
  </body>
</html>
