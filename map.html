<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jouko Lappeenranta Stop Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="topbar">
        <div class="topbar-title-wrap">
          <p class="eyebrow">Jouko Transit</p>
          <h1 class="title">Lappeenranta stop map</h1>
        </div>
        <button id="profileButton" class="icon-button" aria-label="Open profile menu">
          <span>☰</span>
        </button>
      </header>

      <div id="menuPanel" class="menu-panel hidden" aria-label="Main menu">
        <a href="./index.html" class="menu-link">Back to departures</a>
      </div>

      <main class="map-layout">
        <div class="map-legend">
          Tap a marker to view stop details. Polyline shows a concept route across city center.
        </div>
        <div id="lappeenrantaMap" role="region" aria-label="Lappeenranta bus stop map"></div>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item active" href="./map.html">Map</a>
        <a class="nav-item" href="./index.html">Home</a>
        <a class="nav-item" href="./index.html">Tickets</a>
      </nav>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./dist/map.js"></script>
  </body>
</html>
