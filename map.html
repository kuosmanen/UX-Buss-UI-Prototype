<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jouko Lappeenranta Stop Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,600;8..144,700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="map-page">
    <div class="app-frame">
      <div id="menuPanel" class="menu-panel menu-panel-map hidden" aria-label="Main menu">
        <a href="./index.html" class="menu-link">Back to departures</a>
        <a href="./chatbot.html" class="menu-link menu-link-with-icon">
          <span class="material-symbols-rounded menu-link-icon">smart_toy</span>
          <span>Jouko chatbot</span>
        </a>
      </div>

      <main class="map-layout">
        <div class="map-shell">
          <div class="floating-map-bar" aria-label="Jouko app bar">
            <button id="profileButton" class="icon-button icon-on-primary" aria-label="Open menu">
              <span class="material-symbols-rounded">menu</span>
            </button>
            <h1 class="floating-title">Jouko</h1>
            <button id="accountButton" class="icon-button icon-on-primary" aria-label="Account">
              <span class="material-symbols-rounded">account_circle</span>
            </button>
          </div>
          <div class="map-legend map-legend-floating">
            Tap a pink pin to view stop details. Dashed line shows a concept city route.
          </div>
          <div id="lappeenrantaMap" role="region" aria-label="Lappeenranta bus stop map"></div>

          <section class="bus-search-panel" aria-label="Bus line search">
            <div class="bus-search-row">
              <input id="busSearchInput" type="text" placeholder="Search bus line: 1, 1x, 2, 3, 4, 5" />
              <button id="busSearchButton" class="primary-btn">Search</button>
            </div>
            <div id="busSearchResults" class="bus-search-results"></div>
          </section>
        </div>
      </main>

    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./dist/map.js"></script>
  </body>
</html>
